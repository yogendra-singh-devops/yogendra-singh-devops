# Reusable DevSecOps Step Template for Azure DevOps
# Author: Yogendra Singh
parameters:
  - name: scanPath
    type: string
    default: '.'
  - name: failOnCritical
    type: boolean
    default: true

steps:
  - script: |
      echo "[*] Running GitLeaks Secret Detection..."
      curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin
      gitleaks detect --source=${{ parameters.scanPath }} --verbose --redact
    displayName: "GitLeaks Secret Detection"

  - script: |
      echo "[*] Running Checkov Static IaC Analysis..."
      pip install checkov
      checkov -d ${{ parameters.scanPath }} --framework terraform,kubernetes --compact
    displayName: "Checkov Policy Compliance"

